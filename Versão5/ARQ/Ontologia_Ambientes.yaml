     - Class:
       id: Gabarito.Subterrâneo
       subclasse.de: Plano.Gabarito
       subclasse.de: Planos.Horizontais
       subclasse.de: De.Espacialidade
       subclasse.de: Conceitos
       definição: "Gabarito de profundidade. Pode ser usado para definir a cota superior de um projeto subterrâneo, como linha de metrô ou instalações especiais urbanas. Usado como limite de referência de penetração em profundidade para novos projetos."
       definición: "Plantilla de profundidad. Puede utilizarse para establecer la elevación superior de un proyecto subterráneo, como líneas de metro o instalaciones especiales urbanas. Se utiliza como límite de referencia de penetración en profundidad para proyectos nuevos."
       definition: "Depth template. It can be used to set the upper elevation of an underground project, such as subway line or urban special installations. Used as a reference limit of penetration at depth for new projects."
       classe.ifc: "[ IfcBuildingStorey ]"
       categoria.revit: "[ OST_Levels : OST_LevelHeads ]"
       código.abnt: "[ 4A.07.10.07 ]"

     - Class:
       id: Gabarito.Aéreo
       subclasse.de: Plano.Gabarito
       subclasse.de: Planos.Horizontais
       subclasse.de: De.Espacialidade
       subclasse.de: Conceitos
       definição: "Gabarito de altura permitida para realizar voos segurança com UAS (drones). Estabelecido pela ANAC (Agência Nacional de Aviação Civil). Especialmente em regiões próximas a aeroportos."
       definición: "El medidor de altura permite realizar vuelos seguros con UAS (drones). Establecido por ANAC (Agencia Nacional de Aviación Civil). Especialmente en las regiones cercanas a los aeropuertos."
       definition: "Height gauge allowed to perform safe flights with UAS (drones). Established by ANAC (National Civil Aviation Agency). Especially in regions close to airports."
       classe.ifc: "[ IfcBuildingStorey ]"
       categoria.revit: "[ OST_Levels : OST_LevelHeads ]"
       código.abnt: "[ 4A.07.10.07 ]"

     - Class:
       id: Gabarito.Hídrico
       subclasse.de: Plano.Gabarito
       subclasse.de: Planos.Horizontais
       subclasse.de: De.Espacialidade
       subclasse.de: Conceitos
       definição: "Gabarito que define os níveis variáveis de um corpo de água natural, como o mar ou crescentes máximas e mínimas de rios e lagoas. Referência para projetos em zonas litorais ou alagáveis."
       definición: "Plantilla que define los niveles variables de un cuerpo de agua natural, como el mar o los máximos y mínimos ascendentes de ríos y estanques. Referencia para proyectos en zonas costeras o inundables."
       definition: "Template that defines the varying levels of a natural body of water, such as the sea or rising maximums and minimums of rivers and ponds. Reference for projects in coastal or floodable areas."
       classe.ifc: "[ IfcBuildingStorey ]"
       categoria.revit: "[ OST_Levels : OST_LevelHeads ]"
       código.abnt: "[ 4A.07.10.07 ]"

     - Class:
       id: Gabarito.Municipal
       subclasse.de: Plano.Gabarito
       subclasse.de: Planos.Horizontais
       subclasse.de: De.Espacialidade
       subclasse.de: Conceitos
       definição: "Gabarito de altura máxima permitida para as edificações em cada área urbana. Estabelecido por leis municipais de uso e ocupação do solo. Não pode ser ultrapassado pelo projeto."
       definición: "El medidor de altura máxima permitía edificios en cada área urbana. Establecido por las leyes municipales de uso y ocupación del suelo. No puede ser superado por el proyecto."
       definition: "Maximum height gauge allowed for buildings in each urban area. Established by municipal laws of land use and occupation. It cannot be overtaken by the project."
       classe.ifc: "[ IfcBuildingStorey ]"
       categoria.revit: "[ OST_Levels : OST_LevelHeads ]"
       código.abnt: "[ 4A.07.10.07 ]"

