       definition: "Intermediate Geographic Region. Defined by the IBGE of Brazil, there are 133 Intermediate Geographic Regions, of a larger scale, which are articulated by regional capitals or large urban centers. Designed to organize the territory by articulating the Immediate Geographic Regions through a higher hierarchical pole differentiated from the flows of private and public management and the existence of urban functions of greater complexity."
