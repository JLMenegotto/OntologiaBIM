       subclasse.de: Estrutura.Fechamento
       subclasse.de: Conceitos
       definição: "Telha sanduíche trapezoidal isotérmica oferece conforto térmico e economia de energia. Com três trapézios tem grande resistência mecânica, ideal para coberturas que demandam maior espaçamento entre terças ajundando a reduzir a estrutura de sustentação."
       definición: "La baldosa sándwich trapezoidal isotérmica ofrece confort térmico y ahorro energético. Con tres trapecios, tiene una gran resistencia mecánica, ideal para cubiertas que requieren un mayor espacio entre correas, ayudando a reducir la estructura de soporte."
       definition: "Isothermal trapezoidal sandwich tile offers thermal comfort and energy saving. With three trapezoids, it has great mechanical resistance, ideal for roofs that require greater spacing between purlins, helping to reduce the support structure."
       classe.ifc: "[ IfcRoof ]"
       categoria.revit: "[ OST_Roofs ]"
       código.abnt: "null"

