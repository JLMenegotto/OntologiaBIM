     - Class:
       id: Translação.XYZ
       subclasse.de: EGC.Movimentos
       subclasse.de: Elementos.EGC
       subclasse.de: Formantes
       subclasse.de: Conceitos
       definição: "Translação XYZ. A transformação que transforma o ponto por um deslocamento linear. Precisa dos componentes XYZ do vetor de translação."
       definición: "Translación XYZ. La transformación que modifica la posición de un punto mediante un desplazamiento lineal. Necesita los componentes XYZ del vector de translación."
       definition: "XYZ translation. The transformation that modifies the position of a point by means of a linear displacement. You need the XYZ components of the translation vector."

