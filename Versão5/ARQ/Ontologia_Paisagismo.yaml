             é.ordem.botânica: Arecales
             é.família.botânica: Arecaceae
             é.código.de.conservação: Pouco.Preocupante
             descrição: "Indivíduo de Classe Conceitual. Não existe no projeto se não estiver representado por um Indivíduo da classe Projeto."
             nome.científico: "Roystonea oleracea"
             tipo.botânico: "Palmeira"
             diâmetro.do.tronco: 50
             diâmetro.mínimo.da.copa: 5
             diâmetro.máximo.da.copa: 10
             altura.mínima.da.planta: 15
             altura.máxima.da.planta: 30
             tipo.de.raiz: "Fascicular (cabeleira)"
             profundidade.da.raiz: "0"
             tempo.de.crescimento: "10 anos"
             longevidade.da.planta: "mais de 100 anos"
             usada.para: "Ornamental"
             descrição: "Palmeira nativa das Antilhas. De porte imponente, tem valor simbólico. Pode atingir até 40 metros de altura, com tronco liso e colunar de cor esbranquiçada, mais largo em sua base. Entre o termino do tronco e a parte onde nascem as folhas, há uma seção verde, mais grossa.. Muito usada em paisagismo de grandes áreas, como praças e entradas monumentais. Não é recomendada para calçadas estreitas devido ao porte e queda de frutos. Se atribui a Dom João VI a plantação da primeira palmeira (Palma Mater) desta espécie no Jardim Botánico de Rio de Janeiro em 1809. O seu nome científico faz referência ao general americano Roy Stone (1836-1905). A rua Paysandú, de Rio de Janeiro, tem uma alameda monumental de palmeiras imperiais plantadas em 1865 por ordem de Pedro II (https://museunacional.ufrj.br/hortobotanico)"
             mês.de.floração: "janeiro a dezembro"
             bioma: "Mata Atlântica"
             apta.para.calçada: "Não"
             categoria.revit: "[ OST_Planting ]"
