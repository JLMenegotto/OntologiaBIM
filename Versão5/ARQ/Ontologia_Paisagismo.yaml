             nome.científico: "Anadenanthera colubrina"
             tipo.botânico: "Árvore"
             diâmetro.do.tronco: "50"
             diâmetro.mínimo.da.copa: "4"
             diâmetro.máximo.da.copa: "10"
             altura.mínima.da.planta: "8"
             altura.máxima.da.planta: "25"
             tipo.de.raiz: "Pivotante"
             profundidade.da.raiz: "1.5"
             tempo.de.crescimento: "8 anos"
             longevidade.da.planta: "mais de 60 anos"
             usada.para: "Reflorestamento e medicinal"
             descrição: "Árvore perenifólia, com 5 a 10 m de altura, podendo atingir até 20 m de altura e 50 cm de DAP, na idade adulta. Tronco geralmente tortuoso, com acúleos dispersos e ralos. Fuste curto com até 8 m de comprimento. Ramificação: cimosa e irregular. Copa alongada, com folhagem verde-escura, e ramos com ou sem espinhos. Casca com espessura de até 15 mm. A casca externa é acinzentada, áspera e levemente fissurada. Folhas compostas, com 3 a 4 pares de pinas, folíolo mais raquis de 6 a 15 cm de comprimento, folíolo relativamente grande de 1 a 2,5 cm de comprimento por 0,5 a 1 cm de largura, com grossa glândula séssil, orbicular na base superior do pecíolo e uma menor nos extremos raquial e pinar. Pinas com ráquis pubérulo no bordo superior, com 6 a 10 pares de folíolos.  Casca rica em taninos, usada em medicina popular. Típica dos biomas Caatinga, Cerrado e Mata Atlântica (https://www.embrapa.br)"
             mês.de.floração: "setembro a novembro"
             bioma: "Cerrado, Caatinga"
             apta.para.calçada: "Sim"
             categoria.revit: "[ OST_Planting ]"
