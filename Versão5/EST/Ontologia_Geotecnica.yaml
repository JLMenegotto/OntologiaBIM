
Classes:
     - Class:
       id: Erro
       subclasse.de: Erro.de.Preenchimento
       subclasse.de: Erros.de.Preenchimento
       subclasse.de: Errados
       subclasse.de: Conceitos
       definição: "Classe para acumular os erros."
       definición: "Clase para acumular los errores"
       definition: "Class to accumulate errors"

     - Class:
       id: Solo.Reforçado
       subclasse.de: Compactação
       subclasse.de: Elementos.de.Solo
       subclasse.de: GeoTécnicos
       subclasse.de: Conceitos
       definição: "Solo reforçado ou estabilizado por algum método mecânico ou químico."
       definición: "Suelo reforzado o estabilizado por algún método mecánico o químico."
       definition: "Soil reinforced or stabilized by some mechanical or chemical method."

     - Class:
       id: Solo.Reforçado.Dinamicamente
       subclasse.de: Compactação
       subclasse.de: Elementos.de.Solo
       subclasse.de: GeoTécnicos
       subclasse.de: Conceitos
       definição: "O método de uso de máquina de compactação dinâmica geralmente com martelo de queda a altura."
       definición: "El método de compactación dinámica suele ser con martillo de caída a la altura."
       definition: "The use method of dynamic compaction machine usually with drop hammer to height."

     - Class:
       id: Solo.Reforçado.Groute
       subclasse.de: Compactação
       subclasse.de: Elementos.de.Solo
       subclasse.de: GeoTécnicos
       subclasse.de: Conceitos
       definição: "Método de injeção de pasta curável em rachaduras ou poros de uma fundação geotécnica para melhora."
       definición: "Método de inyectar pasta curable en grietas o poros de una base geotécnica para su mejora."
       definition: "Method of injecting curable paste into cracks or pores of a geotechnical foundation for improvement."

     - Class:
       id: Solo.Reforçado.Substituído
       subclasse.de: Compactação
       subclasse.de: Elementos.de.Solo
       subclasse.de: GeoTécnicos
       subclasse.de: Conceitos
       definição: "Cave o solo macio numa determinada faixa abaixo do solo da fundação e então preencha a área."
       definición: "Excava la tierra blanda en una franja determinada por debajo de la tierra de cimentación y luego rellena la zona."
       definition: "Dig the soft soil in a certain strip below the foundation soil and then fill in the area."

     - Class:
       id: Solo.Reforçado.Rolado
       subclasse.de: Compactação
       subclasse.de: Elementos.de.Solo
       subclasse.de: GeoTécnicos
       subclasse.de: Conceitos
       definição: "Tipo de método de compactação que adota máquinas de rolamento."
       definición: "Tipo de método de compactación que adopta máquinas de laminación."
       definition: "Type of compaction method which adopts rolling machines."

     - Class:
       id: Solo.Reforçado.PréCarregado
       subclasse.de: Compactação
       subclasse.de: Elementos.de.Solo
       subclasse.de: GeoTécnicos
       subclasse.de: Conceitos
       definição: "Método que aplica carga à fundação para descarregar água dos poros."
       definición: "Un método que aplica una carga a los cimientos para expulsar el agua por los poros, y que se consolida en ella."
       definition: "A method that applies a charge to the foundation to discharge water from the pores, and it is consolidated to it."

     - Class:
       id: Solo.Reforçado.Drenado
       subclasse.de: Compactação
       subclasse.de: Elementos.de.Solo
       subclasse.de: GeoTécnicos
       subclasse.de: Conceitos
       definição: "Método de compactação por drenagem vertical."
       definición: "Método de compactación por drenaje."
       definition: "Method to set vertical drainage measures on the foundation, so that the water from the sun's pores."

     - Class:
       id: Escavação
       subclasse.de: Escavações
       subclasse.de: Elementos.de.Solo
       subclasse.de: GeoTécnicos
       subclasse.de: Conceitos
       definição: "O vazio resultante da modificação do terreno existente ou da estrutura da estrada por escavação."
       definición: "El vacío resultante de la modificación del terreno existente o la estructura vial mediante excavaciones."
       definition: "The void resulting from the modification of the existing terrain or road structure by excavation."

     - Class:
       id: Escavação.Base
       subclasse.de: Escavações
       subclasse.de: Elementos.de.Solo
       subclasse.de: GeoTécnicos
       subclasse.de: Conceitos
       definição: "Escavação para caves de edifícios, encontros de pontes ou estruturas semelhantes, quer parcialmente."
       definición: "Excavación para sótanos de edificios, estribos de puentes o estructuras similares, ya sea parcialmente."
       definition: "Excavation for basements of buildings, bridge abutments or similar structures, either partially."

     - Class:
       id: Escavação.Corte
       subclasse.de: Escavações
       subclasse.de: Elementos.de.Solo
       subclasse.de: GeoTécnicos
       subclasse.de: Conceitos
       definição: "Escavação onde solo ou rocha abaixo do solo superficial é cortado na profundidade necessária."
       definición: "Excavación donde se corta tierra o roca bajo la capa superficial del suelo hasta la profundidad requerida."
       definition: "Excavation where soil or rock below topsoil is cut to the required depth."

     - Class:
       id: Escavação.Dragagem
       subclasse.de: Escavações
       subclasse.de: Elementos.de.Solo
       subclasse.de: GeoTécnicos
       subclasse.de: Conceitos
       definição: "Escavação subaquática para recuperar material ou para criar uma maior profundidade de água."
       definición: "Excavación submarina para recuperar material o para crear una mayor profundidad de agua."
       definition: "Underwater excavation to recover material or to create a greater depth of water."

     - Class:
       id: Escavação.Terreno
       subclasse.de: Escavações
       subclasse.de: Elementos.de.Solo
       subclasse.de: GeoTécnicos
       subclasse.de: Conceitos
       definição: "Tipo geral de escavação quando o tipo mais preciso não é especificado."
       definición: "Tipo general de excavación cuando no se especifica el tipo más preciso."
       definition: "General type of digging when the most accurate type is not specified."

     - Class:
       id: Escavação.SobreEscavação
       subclasse.de: Escavações
       subclasse.de: Elementos.de.Solo
       subclasse.de: GeoTécnicos
       subclasse.de: Conceitos
       definição: "Escavação que vai além da profundidade necessária para a construção, para substituir o material."
       definición: "Excavaciones que van más allá de la profundidad necesaria para la construcción, para reemplazar el material."
       definition: "Excavation that goes beyond the depth required for construction, to replace the material."

     - Class:
       id: Escavação.Fresagem
       subclasse.de: Escavações
       subclasse.de: Elementos.de.Solo
       subclasse.de: GeoTécnicos
       subclasse.de: Conceitos
       definição: "Remoção de material caduco do topo do pavimento para ser substituído por novo material."
       definición: "Retirada de material obsoleto de la parte superior del pavimento para ser reemplazado por material nuevo."
       definition: "Removal of outdated material from the top of the pavement to be replaced by new material."

     - Class:
       id: Escavação.Banqueta
       subclasse.de: Escavações
       subclasse.de: Elementos.de.Solo
       subclasse.de: GeoTécnicos
       subclasse.de: Conceitos
       definição: "Remoção da parte mais suave da encosta da estrada, realizada em passos, durante a ampliação de uma estrada."
       definición: "La eliminación de la parte más blanda de la pendiente de la carretera, realizada por escalones, durante el ensanchamiento de una carretera."
       definition: "Removal of the softest part of the road slope, carried out in steps, during the widening of a road."

     - Class:
       id: Escavação.Remoção
       subclasse.de: Escavações
       subclasse.de: Elementos.de.Solo
       subclasse.de: GeoTécnicos
       subclasse.de: Conceitos
       definição: "Escavação onde a camada superficial de solo contendo material orgânico é removida."
       definición: "Excavación en la que se retira la capa superficial del suelo que contiene material orgánico."
       definition: "Excavation where the topsoil containing organic material is removed."

     - Class:
       id: Escavação.Trincheira
       subclasse.de: Escavações
       subclasse.de: Elementos.de.Solo
       subclasse.de: GeoTécnicos
       subclasse.de: Conceitos
       definição: "Escavação cujo comprimento excede muito a profundidade e largura."
       definición: "Excavaciones cuya longitud supera con creces la profundidad y la anchura."
       definition: "Excavation whose length far exceeds depth and width."

     - Class:
       id: Terrapleno
       subclasse.de: Terraplenagens
       subclasse.de: Elementos.de.Solo
       subclasse.de: GeoTécnicos
       subclasse.de: Conceitos
       definição: "Tipo de elemento construído criado por atividades de terraplenagem para construir subleito."
       definición: "Tipo de elemento construido creado por actividades de movimiento de tierras para construir subsuelo."
       definition: "Type of built element created by earthmoving activities to construct subgrade."

     - Class:
       id: Aterro.Terrapleno
       subclasse.de: Terraplenagens
       subclasse.de: Elementos.de.Solo
       subclasse.de: GeoTécnicos
       subclasse.de: Conceitos
       definição: "Tipo de elemento de terraplenagem criado por atividades de terraplenagem para construir subleito."
       definición: "Tipo de elemento de movimiento de tierras creado por actividades de movimiento de tierras para construir subsuelo."
       definition: "Type of earthmoving element created by earthmoving activities to construct subgrade."

     - Class:
       id: Aterro.Reenchimento
       subclasse.de: Terraplenagens
       subclasse.de: Elementos.de.Solo
       subclasse.de: GeoTécnicos
       subclasse.de: Conceitos
       definição: "Preenchimento atrás de paredes de contenção ou de outras estruturas, como cais, atrás dos suportes."
       definición: "Rellena detrás de muros de contención u otras estructuras, como pilares, detrás de soportes."
       definition: "Fill behind retaining walls or other structures, such as piers, behind supports."

     - Class:
       id: Aterro.Contrapeso
       subclasse.de: Terraplenagens
       subclasse.de: Elementos.de.Solo
       subclasse.de: GeoTécnicos
       subclasse.de: Conceitos
       definição: "Aterros construídos ao lado da estrutura rodoviária principal para reduzir a ocupação da estrada."
       definición: "Se construyeron terraplenes junto a la estructura principal de la carretera para reducir la ocupación de las carreteras."
       definition: "Embankments built next to the main road structure to reduce road occupation."

     - Class:
       id: Aterro.Preenchimento
       subclasse.de: Terraplenagens
       subclasse.de: Elementos.de.Solo
       subclasse.de: GeoTécnicos
       subclasse.de: Conceitos
       definição: "Tipo predominantemente longitudinal de elemento de terraplenagem, sem nenhum outro tipo específico."
       definición: "Es un tipo predominantemente longitudinal de elemento de movimiento de tierras, sin otro tipo específico."
       definition: "Predominantly longitudinal type of earthmoving element, with no other specific type."

     - Class:
       id: Aterro.Inclinado
       subclasse.de: Terraplenagens
       subclasse.de: Elementos.de.Solo
       subclasse.de: GeoTécnicos
       subclasse.de: Conceitos
       definição: "Side inclinação (massa) que preenche a estrutura da rodovia ou o preenchimento da inclinação."
       definición: "Pendiente lateral (masa) que llena la estructura de la carretera o el relleno de la pendiente."
       definition: "Side slope (mass) that fills the highway structure or the infill of the slope."

     - Class:
       id: Aterro.Subterrâneo
       subclasse.de: Terraplenagens
       subclasse.de: Elementos.de.Solo
       subclasse.de: GeoTécnicos
       subclasse.de: Conceitos
       definição: "Elemento de terra que da sustentação a estrutura abaixo do pavimento e acima do solo natural."
       definición: "Elemento tierra que sostiene la estructura bajo el pavimento y por encima del suelo natural."
       definition: "Earth element that supports the structure below the pavement and above the natural soil."

     - Class:
       id: Aterro.Camada
       subclasse.de: Terraplenagens
       subclasse.de: Elementos.de.Solo
       subclasse.de: GeoTécnicos
       subclasse.de: Conceitos
       definição: "Parte superior do solo, natural ou construído, que suporta as cargas transmitidas pela estrutura."
       definición: "La parte superior del suelo, natural o edificada, que soporta las cargas transmitidas por la estructura."
       definition: "Upper part of the soil, natural or built, that supports the loads transmitted by the structure."

     - Class:
       id: Aterro.Transição
       subclasse.de: Terraplenagens
       subclasse.de: Elementos.de.Solo
       subclasse.de: GeoTécnicos
       subclasse.de: Conceitos
       definição: "Seção de subleito para garantir a consistência da rigidez e evitar recalques irregulares."
       definición: "Sección de subsuelo para asegurar la consistencia de la rigidez y evitar asentamientos desiguales."
       definition: "Subgrade section to ensure consistency of stiffness and prevent uneven settlement."

