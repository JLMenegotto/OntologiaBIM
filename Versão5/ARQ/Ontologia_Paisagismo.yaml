     - Individual:
       id: Fungos
       type: Fungo
       Facts:
             descrição: "Indivíduo de Classe Conceitual. Não existe no projeto se não estiver representado por um Indivíduo da classe Projeto."
             descrição: "Refere se ao conjunto do reino Fungi. Incluem cogumelos, bolores e leveduras. São heterotróficos, ou seja, não fazem fotossíntese e obtêm energia por decomposição"
             categoria.revit: "[ OST_Planting ]"
             classe.ifc: "[ IfcGeographicElement ]"
             código.abnt: "[ 3E.02.12 ]"

     - Individual:
       id: Briófita
       type: Divisão.Botânica
       Facts:
             descrição: "Indivíduo de Classe Conceitual. Não existe no projeto se não estiver representado por um Indivíduo da classe Projeto."
             descrição: "Plantas pequenas e simples, sem vasos condutores, como musgos e hepáticas. Vivem em ambientes úmidos e não produzem sementes nem flores. São as plantas terrestres mais primitivas, importantes para a retenção de água no solo e como indicadores ambientais"
             categoria.revit: "[ OST_Planting ]"
             classe.ifc: "[ IfcGeographicElement ]"
             código.abnt: "[ 3E.02.12 ]"

     - Individual:
       id: Angiosperma
       type: Divisão.Botânica
       Facts:
             descrição: "Indivíduo de Classe Conceitual. Não existe no projeto se não estiver representado por um Indivíduo da classe Projeto."
             descrição: "Plantas que produzem flores e frutos com sementes. Representam o grupo mais diverso do Reino Plantae, incluindo árvores, arbustos, ervas e gramíneas. Exemplos: roseiras, mangueiras, milho"
             categoria.revit: "[ OST_Planting ]"
             classe.ifc: "[ IfcGeographicElement ]"
             código.abnt: "[ 3E.02.12 ]"

     - Individual:
       id: Gimnosperma
       type: Divisão.Botânica
       Facts:
             descrição: "Indivíduo de Classe Conceitual. Não existe no projeto se não estiver representado por um Indivíduo da classe Projeto."
             descrição: "Plantas que produzem sementes nuas, ou seja, não envoltas por frutos. Não têm flores. Exemplos: pinheiros e ciprestes"
             categoria.revit: "[ OST_Planting ]"
             classe.ifc: "[ IfcGeographicElement ]"
             código.abnt: "[ 3E.02.12 ]"

     - Individual:
       id: Licófita
       type: Divisão.Botânica
       Facts:
             descrição: "Indivíduo de Classe Conceitual. Não existe no projeto se não estiver representado por um Indivíduo da classe Projeto."
             descrição: "Plantas vasculares primitivas, com vasos condutores, mas sem sementes. São semelhantes às samambaias, mas com estrutura mais simples. Exemplo: Selaginella"
             categoria.revit: "[ OST_Planting ]"
             classe.ifc: "[ IfcGeographicElement ]"
             código.abnt: "[ 3E.02.12 ]"

     - Individual:
       id: Samambaia
       type: Divisão.Botânica
       Facts:
             descrição: "Indivíduo de Classe Conceitual. Não existe no projeto se não estiver representado por um Indivíduo da classe Projeto."
             descrição: "Plantas chamadas de pteridófitas. São plantas vasculares que não produzem sementes. Reproduzem se por esporos e têm folhas geralmente grandes e recortadas"
             categoria.revit: "[ OST_Planting ]"
             classe.ifc: "[ IfcGeographicElement ]"
             código.abnt: "[ 3E.02.12 ]"

     - Individual:
       id: Liliopsida
       type: Classe.Botânica
       Facts:
             descrição: "Indivíduo de Classe Conceitual. Não existe no projeto se não estiver representado por um Indivíduo da classe Projeto."
             descrição: "Sementes com um cotilédone. Folhas com nervuras paralelas, com raízes geralmente fasciculadas (cabeleiras) flores com peças florais em múltiplos de 3. Exemplos: gramíneas, orquídeas, palmeiras, lírios. Muitas espécies são cultivadas para alimentação (como arroz, milho e trigo) ou ornamentação"
             categoria.revit: "[ OST_Planting ]"
             classe.ifc: "[ IfcGeographicElement ]"
             código.abnt: "[ 3E.02.12 ]"

     - Individual:
       id: Magnoliopsida
       type: Classe.Botânica
       Facts:
             descrição: "Indivíduo de Classe Conceitual. Não existe no projeto se não estiver representado por um Indivíduo da classe Projeto."
             descrição: "Sementes com dois cotilédones. Folhas com nervuras reticuladas (em rede). Raízes geralmente pivotantes (com raiz principal). Flores com peças florais em múltiplos de 4 ou 5. Exemplo de plantas: feijão, soja, girassol, roseiras. Importância: Inclui grande parte das plantas alimentícias, medicinais e ornamentais"
             categoria.revit: "[ OST_Planting ]"
             classe.ifc: "[ IfcGeographicElement ]"
             código.abnt: "[ 3E.02.12 ]"

     - Individual:
       id: Pinopsida
       type: Classe.Botânica
       Facts:
             descrição: "Indivíduo de Classe Conceitual. Não existe no projeto se não estiver representado por um Indivíduo da classe Projeto."
             descrição: "Sementes nuas e sem frutos. Folhas geralmente aciculadas (em forma de agulha). Presença de estróbilos (cones) como estruturas reprodutivas. Exemplo de plantas: pinheiros, ciprestes, araucárias. Importância: Muitas espécies são utilizadas na produção de madeira, papel e resinas"
             categoria.revit: "[ OST_Planting ]"
             classe.ifc: "[ IfcGeographicElement ]"
             código.abnt: "[ 3E.02.12 ]"

     - Individual:
       id: Aquifoliales
       type: Ordem.Botânica
       Facts:
             descrição: "Indivíduo de Classe Conceitual. Não existe no projeto se não estiver representado por um Indivíduo da classe Projeto."
             descrição: "Inclui cinco famílias. A mais conhecida é a Aquifoliaceae, que inclui o gênero Ilex (os azevinhos). As espécies dessa ordem são majoritariamente arbustos ou árvores pequenas, com folhas coriáceas e frutos do tipo drupa."
             categoria.revit: "[ OST_Planting ]"
             classe.ifc: "[ IfcGeographicElement ]"
             código.abnt: "[ 3E.02.12 ]"

     - Individual:
       id: Arecales
       type: Ordem.Botânica
       Facts:
             descrição: "Indivíduo de Classe Conceitual. Não existe no projeto se não estiver representado por um Indivíduo da classe Projeto."
             descrição: "Inclui as palmeiras. São monocotiledôneas lenhosas com folhas grandes e inflorescências protegidas por espatas. Produzem frutos como coco, palmito e tâmaras"
             categoria.revit: "[ OST_Planting ]"
             classe.ifc: "[ IfcGeographicElement ]"
             código.abnt: "[ 3E.02.12 ]"

     - Individual:
       id: Asparagales
       type: Ordem.Botânica
       Facts:
             descrição: "Indivíduo de Classe Conceitual. Não existe no projeto se não estiver representado por um Indivíduo da classe Projeto."
             descrição: "Inclui herbáceas como lírios, cebolas, alhos e orquídeas. Possuem flores com seis tépalas e sementes com fitomelanina. É a segunda ordem mais importante economicamente entre as monocotiledôneas. "
             categoria.revit: "[ OST_Planting ]"
             classe.ifc: "[ IfcGeographicElement ]"
             código.abnt: "[ 3E.02.12 ]"

     - Individual:
       id: Asterales
       type: Ordem.Botânica
