             tipo.botânico: "Palmeira"
             diâmetro.do.tronco: 130
             diâmetro.mínimo.da.copa: 3
             diâmetro.máximo.da.copa: 5
             altura.mínima.da.planta: 20
             altura.máxima.da.planta: 30
             tipo.de.raiz: "Fascicular (cabeleira)"
             profundidade.da.raiz: "1 até 3 m"
             tempo.de.crescimento: "7 anos"
             longevidade.da.planta: "80 anos"
             usada.para: "Ornamental em parques urbanos"
             descrição: "Tronco esguio com folhas palmadas em leque, com até 5 m de envergadura. Também é chamada de palmeira-parasol ou palma de Ceilão. Após floração deve ser monitorada por especialistas, pois pode apresentar risco de queda"
             mês.de.floração: "Monocárpica, floresce uma única vez após 60 a 80. Após a floração, entra em senescência e as folhas secam o tronco perde vigor e a planta morre. Nessa época, produz milhões de frutos esféricos. O evento pode ser apreciado no aterro do Flamengo em Novembro de 2025, pois as palmeiras plantadas há mais de 60 anos pelo paisagista Roberto Burle Marx finalmente revelaram o seu espetáculo mais grandioso"
             bioma: "Cultivada"
             apta.para.calçada: "Não"
             categoria.revit: "[ OST_Planting ]"
             classe.ifc: "[ IfcGeographicElement ]"
             código.abnt: "[ 3E.02.12 ]"

