     - Class:
       id: Ardósia
       subclasse.de: Pedras
       subclasse.de: Matérias.Minerais.Pétreas
       subclasse.de: De.Materialidade
       subclasse.de: Conceitos
       definição: "Originada em argila ou xisto submetidos a metamorfismo de baixo grau. Composta por quartzo, mica, clorita. De granulação fina, clivagem em lâminas finas, cores escuras. Usada e telhados, pisos, fachadas, mesas e lousas escolares."
       definición: "Se originó en arcilla o lutita sometida a metamorfismo de bajo grado. Compuesto de cuarzo, mica, clorita. De grano fino, escote en hojas finas, colores oscuros. Usados, tejados, suelos, fachadas, mesas y pizarras escolares."
       definition: "Originated in clay or shale subjected to low-grade metamorphism. Composed of quartz, mica, chlorite. Fine-grained, cleavage into thin blades, dark colors. Used and roofs, floors, facades, tables and school blackboards."
       classe.ifc: "[ IfcMaterial : IfcText : IfcLabel : IfcMaterialRelationship ]"
       categoria.revit: "[ OST_Materials : OST_MaterialTags ]"
       código.abnt: "[ 0M.20.10.01.50 ]"

     - Class:
       id: Arenito
       subclasse.de: Pedras
       subclasse.de: Matérias.Minerais.Pétreas
       subclasse.de: De.Materialidade
       subclasse.de: Conceitos
       definição: "Originada em compactação e cimentação de grãos de areia. Composta principalmente por quartzo e feldspato, cimentados por sílica, carbonato ou óxidos de ferro. É porosa e com cores variadas. Usada em revestimentos e reservatórios de água e petróleo."
       definición: "Se originó en la compactación y cementación de granos de arena. Compuesto principalmente por cuarzo y feldespato, cementado por sílice, carbonato o óxidos de hierro. Es poroso y de colores variados. Se utiliza en recubrimientos y depósitos de agua y aceite."
       definition: "Originated in compaction and cementation of sand grains. Composed mainly of quartz and feldspar, cemented by silica, carbonate or iron oxides. It is porous and with varied colors. Used in coatings and water and oil reservoirs."
       classe.ifc: "[ IfcMaterial : IfcText : IfcLabel : IfcMaterialRelationship ]"
       categoria.revit: "[ OST_Materials : OST_MaterialTags ]"
       código.abnt: "[ 0M.20.10.01.50.03 ]"

     - Class:
       id: Basalto
       subclasse.de: Pedras
       subclasse.de: Matérias.Minerais.Pétreas
       subclasse.de: De.Materialidade
       subclasse.de: Conceitos
       definição: "Originada em lava vulcânica resfriada rapidamente. Composta por silicatos de ferro e magnésio. Cor escura textura fina, muito resistente. Usada em brita para concreto, pavimentação e revestimentos."
       definición: "Se originó en lava volcánica enfriada rápidamente. Compuesto por silicatos de hierro y magnesio. Color oscuro, textura fina, muy resistente. Se utiliza en grava para hormigón, pavimentación y recubrimientos."
       definition: "Originated in rapidly cooled volcanic lava. Composed of iron and magnesium silicates. Dark color, fine texture, very resistant. Used in gravel for concrete, paving and coatings."
       classe.ifc: "[ IfcMaterial : IfcText : IfcLabel : IfcMaterialRelationship ]"
       categoria.revit: "[ OST_Materials : OST_MaterialTags ]"
       código.abnt: "[ 0M.20.10.01 ]"

     - Class:
       id: Travertino 
       subclasse.de: Pedras
       subclasse.de: Matérias.Minerais.Pétreas
       subclasse.de: De.Materialidade
       subclasse.de: Conceitos
       definição: "Originado em precipitação de carbonato de cálcio em ambientes de águas termais e cavernas. Composta por calcita, aragonita e limonita. Porosa com veios marcantes, tons bege a marrom. Usada para valorizar revestimentos internos e externos, pisos, escadas, colunas."
       definición: "Se originó en la precipitación de carbonato cálcico en manantiales termales y ambientes de cuevas. Compuesto por calcita, aragonita y limonita. Poroso con venas llamativas, tonos beige a marrones. Se utiliza para mejorar recubrimientos internos y exteriores, suelos, escaleras y columnas."
       definition: "Originated in precipitation of calcium carbonate in hot springs and cave environments. Composed of calcite, aragonite and limonite. Porous with striking veins, beige to brown tones. Used to enhance internal and external coatings, floors, stairs, columns."
       classe.ifc: "[ IfcMaterial : IfcText : IfcLabel : IfcMaterialRelationship ]"
       categoria.revit: "[ OST_Materials : OST_MaterialTags ]"
       código.abnt: "[ 0M.20.10.01 ]"

