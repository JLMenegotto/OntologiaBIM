       subclasse.de: Estrutura.Fechamento
       subclasse.de: Conceitos
       definição: "Sistema de telha sanduíche zipada é aplicado em coberturas com baixa inclinação e grandes áreas, oferecendo isolamento térmico e estanqueidade sem a necessidade de furações."
       definición: "El sistema de teja sándwich con cremallera se aplica a cubiertas con baja pendiente y grandes superficies, ofreciendo aislamiento térmico y estanqueidad sin necesidad de perforación."
       definition: "Zipped sandwich tile system is applied to roofs with low slope and large areas, offering thermal insulation and watertightness without the need for drilling."
       classe.ifc: "[ IfcRoof ]"
       categoria.revit: "[ OST_Roofs ]"
       código.abnt: "null"

