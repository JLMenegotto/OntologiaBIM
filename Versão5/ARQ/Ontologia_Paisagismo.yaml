     - Individual:
       id: Fungos
       type: Fungo
       Facts:
             descrição: "Indivíduo de Classe Conceitual. Não existe no projeto se não estiver representado por um Indivíduo da classe Projeto."
             descrição: "Refere se ao conjunto do reino Fungi. Incluem cogumelos, bolores e leveduras. São heterotróficos, ou seja, não fazem fotossíntese e obtêm energia por decomposição"
             categoria.revit: "[ OST_Planting ]"
             classe.ifc: "[ IfcGeographicElement ]"
             código.abnt: "[ 3E.02.12 ]"

     - Individual:
       id: Briófita
       type: Divisão.Botânica
       Facts:
             descrição: "Indivíduo de Classe Conceitual. Não existe no projeto se não estiver representado por um Indivíduo da classe Projeto."
             descrição: "Plantas pequenas e simples, sem vasos condutores, como musgos e hepáticas. Vivem em ambientes úmidos e não produzem sementes nem flores. São as plantas terrestres mais primitivas, importantes para a retenção de água no solo e como indicadores ambientais"
             categoria.revit: "[ OST_Planting ]"
             classe.ifc: "[ IfcGeographicElement ]"
             código.abnt: "[ 3E.02.12 ]"

     - Individual:
       id: Angiosperma
       type: Divisão.Botânica
       Facts:
             descrição: "Indivíduo de Classe Conceitual. Não existe no projeto se não estiver representado por um Indivíduo da classe Projeto."
             descrição: "Plantas que produzem flores e frutos com sementes. Representam o grupo mais diverso do Reino Plantae, incluindo árvores, arbustos, ervas e gramíneas. Exemplos: roseiras, mangueiras, milho"
             categoria.revit: "[ OST_Planting ]"
             classe.ifc: "[ IfcGeographicElement ]"
             código.abnt: "[ 3E.02.12 ]"

     - Individual:
       id: Gimnosperma
       type: Divisão.Botânica
       Facts:
             descrição: "Indivíduo de Classe Conceitual. Não existe no projeto se não estiver representado por um Indivíduo da classe Projeto."
             descrição: "Plantas que produzem sementes nuas, ou seja, não envoltas por frutos. Não têm flores. Exemplos: pinheiros e ciprestes"
             categoria.revit: "[ OST_Planting ]"
             classe.ifc: "[ IfcGeographicElement ]"
             código.abnt: "[ 3E.02.12 ]"

     - Individual:
       id: Licófita
       type: Divisão.Botânica
       Facts:
             descrição: "Indivíduo de Classe Conceitual. Não existe no projeto se não estiver representado por um Indivíduo da classe Projeto."
             descrição: "Plantas vasculares primitivas, com vasos condutores, mas sem sementes. São semelhantes às samambaias, mas com estrutura mais simples. Exemplo: Selaginella"
             categoria.revit: "[ OST_Planting ]"
             classe.ifc: "[ IfcGeographicElement ]"
             código.abnt: "[ 3E.02.12 ]"

     - Individual:
       id: Samambaia
       type: Divisão.Botânica
       Facts:
             descrição: "Indivíduo de Classe Conceitual. Não existe no projeto se não estiver representado por um Indivíduo da classe Projeto."
             descrição: "Plantas chamadas de pteridófitas. São plantas vasculares que não produzem sementes. Reproduzem se por esporos e têm folhas geralmente grandes e recortadas"
             categoria.revit: "[ OST_Planting ]"
             classe.ifc: "[ IfcGeographicElement ]"
             código.abnt: "[ 3E.02.12 ]"

     - Individual:
       id: Liliopsida
       type: Classe.Botânica
       Facts:
             descrição: "Indivíduo de Classe Conceitual. Não existe no projeto se não estiver representado por um Indivíduo da classe Projeto."
             descrição: "Sementes com um cotilédone. Folhas com nervuras paralelas, com raízes geralmente fasciculadas (cabeleiras) flores com peças florais em múltiplos de 3. Exemplos: gramíneas, orquídeas, palmeiras, lírios. Muitas espécies são cultivadas para alimentação (como arroz, milho e trigo) ou ornamentação"
             categoria.revit: "[ OST_Planting ]"
             classe.ifc: "[ IfcGeographicElement ]"
             código.abnt: "[ 3E.02.12 ]"

     - Individual:
       id: Magnoliopsida
       type: Classe.Botânica
       Facts:
             descrição: "Indivíduo de Classe Conceitual. Não existe no projeto se não estiver representado por um Indivíduo da classe Projeto."
             descrição: "Sementes com dois cotilédones. Folhas com nervuras reticuladas (em rede). Raízes geralmente pivotantes (com raiz principal). Flores com peças florais em múltiplos de 4 ou 5. Exemplo de plantas: feijão, soja, girassol, roseiras. Importância: Inclui grande parte das plantas alimentícias, medicinais e ornamentais"
             categoria.revit: "[ OST_Planting ]"
             classe.ifc: "[ IfcGeographicElement ]"
             código.abnt: "[ 3E.02.12 ]"

     - Individual:
       id: Pinopsida
       type: Classe.Botânica
       Facts:
             descrição: "Indivíduo de Classe Conceitual. Não existe no projeto se não estiver representado por um Indivíduo da classe Projeto."
             descrição: "Sementes nuas e sem frutos. Folhas geralmente aciculadas (em forma de agulha). Presença de estróbilos (cones) como estruturas reprodutivas. Exemplo de plantas: pinheiros, ciprestes, araucárias. Importância: Muitas espécies são utilizadas na produção de madeira, papel e resinas"
             categoria.revit: "[ OST_Planting ]"
             classe.ifc: "[ IfcGeographicElement ]"
             código.abnt: "[ 3E.02.12 ]"

     - Individual:
       id: Aquifoliales
       type: Ordem.Botânica
       Facts:
             descrição: "Indivíduo de Classe Conceitual. Não existe no projeto se não estiver representado por um Indivíduo da classe Projeto."
             descrição: "Inclui cinco famílias. A mais conhecida é a Aquifoliaceae, que inclui o gênero Ilex (os azevinhos). As espécies dessa ordem são majoritariamente arbustos ou árvores pequenas, com folhas coriáceas e frutos do tipo drupa."
             categoria.revit: "[ OST_Planting ]"
             classe.ifc: "[ IfcGeographicElement ]"
             código.abnt: "[ 3E.02.12 ]"

     - Individual:
       id: Arecales
       type: Ordem.Botânica
       Facts:
             descrição: "Indivíduo de Classe Conceitual. Não existe no projeto se não estiver representado por um Indivíduo da classe Projeto."
             descrição: "Inclui as palmeiras. São monocotiledôneas lenhosas com folhas grandes e inflorescências protegidas por espatas. Produzem frutos como coco, palmito e tâmaras"
             categoria.revit: "[ OST_Planting ]"
             classe.ifc: "[ IfcGeographicElement ]"
             código.abnt: "[ 3E.02.12 ]"

     - Individual:
       id: Asparagales
       type: Ordem.Botânica
       Facts:
             descrição: "Indivíduo de Classe Conceitual. Não existe no projeto se não estiver representado por um Indivíduo da classe Projeto."
             descrição: "Inclui herbáceas como lírios, cebolas, alhos e orquídeas. Possuem flores com seis tépalas e sementes com fitomelanina. É a segunda ordem mais importante economicamente entre as monocotiledôneas. "
             categoria.revit: "[ OST_Planting ]"
             classe.ifc: "[ IfcGeographicElement ]"
             código.abnt: "[ 3E.02.12 ]"

     - Individual:
       id: Asterales
       type: Ordem.Botânica
       Facts:
             descrição: "Indivíduo de Classe Conceitual. Não existe no projeto se não estiver representado por um Indivíduo da classe Projeto."
             descrição: "Inclui a família Asteraceae, a maior entre as angiospermas. Suas flores são compostas em capítulos, como girassol, margarida e camomila. Importantes para polinizadores e medicina"
             categoria.revit: "[ OST_Planting ]"
             classe.ifc: "[ IfcGeographicElement ]"
             código.abnt: "[ 3E.02.12 ]"

     - Individual:
       id: Boraginales
       type: Ordem.Botânica
       Facts:
             descrição: "Indivíduo de Classe Conceitual. Não existe no projeto se não estiver representado por um Indivíduo da classe Projeto."
             descrição: "Inclui ervas, arbustos e árvores com folhas alternas e flores vistosas, muitas vezes dispostas em inflorescências escorpioides. A família mais representativa é Boraginaceae, conhecida por espécies como o 'confrei' e o 'não te esqueças de mim'"
             categoria.revit: "[ OST_Planting ]"
             classe.ifc: "[ IfcGeographicElement ]"
             código.abnt: "[ 3E.02.12 ]"

     - Individual:
       id: Brassicales
       type: Ordem.Botânica
       Facts:
             descrição: "Indivíduo de Classe Conceitual. Não existe no projeto se não estiver representado por um Indivíduo da classe Projeto."
             descrição: "Inclui mais de 4.000 espécies, muitas delas com importância econômica, como couve, mostarda, papaia e moringa. Uma característica de esta ordem é a produção de compostos de glucosinolato, conhecidos como 'óleos de mostarda'"
             categoria.revit: "[ OST_Planting ]"
             classe.ifc: "[ IfcGeographicElement ]"
             código.abnt: "[ 3E.02.12 ]"

     - Individual:
       id: Caryophyllales
       type: Ordem.Botânica
       Facts:
             descrição: "Indivíduo de Classe Conceitual. Não existe no projeto se não estiver representado por um Indivíduo da classe Projeto."
             descrição: "Inclui diversas plantas como beterraba, cactos e amaranto. Muitas têm pigmentos betalaínicos em vez de antocianinas. Adaptadas a ambientes áridos e salinos"
             categoria.revit: "[ OST_Planting ]"
             classe.ifc: "[ IfcGeographicElement ]"
             código.abnt: "[ 3E.02.12 ]"

     - Individual:
       id: Celastrales
       type: Ordem.Botânica
       Facts:
             descrição: "Indivíduo de Classe Conceitual. Não existe no projeto se não estiver representado por um Indivíduo da classe Projeto."
             descrição: "Inclui arbustos e árvores como Celastraceae. Possuem folhas simples, frutos cápsulas ou drupas, e são comuns em florestas tropicais e temperadas"
             categoria.revit: "[ OST_Planting ]"
             classe.ifc: "[ IfcGeographicElement ]"
             código.abnt: "[ 3E.02.12 ]"

     - Individual:
       id: Cucurbitales
       type: Ordem.Botânica
       Facts:
             descrição: "Indivíduo de Classe Conceitual. Não existe no projeto se não estiver representado por um Indivíduo da classe Projeto."
             descrição: "Inclui trepadeiras e herbáceas com flores unissexuais, pentâmeras como as abóbora, melancia e begônias. Muitas são trepadeiras com frutos comestíveis ou flores ornamentais"
             categoria.revit: "[ OST_Planting ]"
             classe.ifc: "[ IfcGeographicElement ]"
             código.abnt: "[ 3E.02.12 ]"

     - Individual:
       id: Ericales
       type: Ordem.Botânica
       Facts:
             descrição: "Indivíduo de Classe Conceitual. Não existe no projeto se não estiver representado por um Indivíduo da classe Projeto."
             descrição: "Inclui plantas como chá (Camellia), mirtilo, azaleia e caju. Muitas têm folhas coriáceas e flores vistosas. Importantes na horticultura e alimentação"
             categoria.revit: "[ OST_Planting ]"
             classe.ifc: "[ IfcGeographicElement ]"
             código.abnt: "[ 3E.02.12 ]"

     - Individual:
       id: Fabales
       type: Ordem.Botânica
       Facts:
             descrição: "Indivíduo de Classe Conceitual. Não existe no projeto se não estiver representado por um Indivíduo da classe Projeto."
             descrição: "Inclui as leguminosas (Fabaceae), como feijão, soja e ervilha. Fixam nitrogênio no solo por simbiose com bactérias. Frutos em forma de vagem"
             categoria.revit: "[ OST_Planting ]"
             classe.ifc: "[ IfcGeographicElement ]"
             código.abnt: "[ 3E.02.12 ]"

     - Individual:
       id: Gentianales
       type: Ordem.Botânica
       Facts:
             descrição: "Indivíduo de Classe Conceitual. Não existe no projeto se não estiver representado por um Indivíduo da classe Projeto."
             descrição: "Inclui famílias como Apocynaceae e Rubiaceae. Muitas espécies têm látex e flores vistosas. Algumas são medicinais, como a quina e o jasmim"
             categoria.revit: "[ OST_Planting ]"
             classe.ifc: "[ IfcGeographicElement ]"
             código.abnt: "[ 3E.02.12 ]"

     - Individual:
       id: Lamiales
       type: Ordem.Botânica
       Facts:
             descrição: "Indivíduo de Classe Conceitual. Não existe no projeto se não estiver representado por um Indivíduo da classe Projeto."
             descrição: "Inclui plantas como lavanda, alecrim, manjericão e ipê. Muitas têm folhas aromáticas e flores bilabiadas. Importantes na culinária e paisagismo"
             categoria.revit: "[ OST_Planting ]"
             classe.ifc: "[ IfcGeographicElement ]"
             código.abnt: "[ 3E.02.12 ]"

     - Individual:
       id: Laurales
       type: Ordem.Botânica
       Facts:
             descrição: "Indivíduo de Classe Conceitual. Não existe no projeto se não estiver representado por um Indivíduo da classe Projeto."
             descrição: "Inclui árvores aromáticas como canela e louro (Lauraceae). Possuem folhas simples e flores pequenas. Comuns em florestas tropicais úmidas"
             categoria.revit: "[ OST_Planting ]"
             classe.ifc: "[ IfcGeographicElement ]"
             código.abnt: "[ 3E.02.12 ]"

     - Individual:
       id: Lecythidales
       type: Ordem.Botânica
