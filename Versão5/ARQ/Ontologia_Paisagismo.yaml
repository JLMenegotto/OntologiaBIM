     - Class:
       id: Árvore
       subclasse.de: Flora
       subclasse.de: Reino.Vegetal
       subclasse.de: Reinos.Naturais
       subclasse.de: Conceitos
       definição: "Planta lenhosa de grande porte, com tronco único e copa elevada. Altura superior a 5 m, raiz profunda, usadas em arborização urbana. Fazem fotossíntese. Para o Serviço Florestal Brasileiro é um Hábito do indivíduo definido no Inventário Florestal Nacional."
       definición: "Planta leñosa grande, con un solo tronco y copa elevada. Altura superior a 5 m, raíz profunda, utilizada en forestación urbana. Realizan la fotosíntesis. Para el Servicio Forestal Brasileño, es un hábito del individuo definido en el Inventario Forestal Nacional."
       definition: "Large woody plant, with a single trunk and elevated crown. Height greater than 5 m, deep root, used in urban afforestation. They photosynthesize. For the Brazilian Forest Service, it is a habit of the individual defined in the National Forest Inventory."
       classe.ifc: "[ IfcGeographicElement : IfcSlab : IfcPavement : IfcKerb : IfcBuildingElementProxy ]"
       categoria.revit: "[ OST_Planting : OST_PlantingHiddenLines : OST_Floors ]"
       código.abnt: "[ 3E.02.12 ]"

     - Class:
       id: Arbusto
       subclasse.de: Flora
       subclasse.de: Reino.Vegetal
       subclasse.de: Reinos.Naturais
       subclasse.de: Conceitos
       definição: "Planta lenhosa de pequeno a médio porte, com vários caules desde a base. Altura entre 1 e 5 m, copa densa, ideal para cercas vivas e bordaduras. Fazem fotossíntese. Para o Serviço Florestal Brasileiro é um Hábito do indivíduo patrimonializado como planta."
       definición: "Planta leñosa de tamaño pequeño a mediano, con varios tallos desde la base. Altura entre 1 y 5 m, dosel denso, ideal para setos y bordes. Realizan la fotosíntesis. Para el Servicio Forestal Brasileño, es un hábito del individuo patrimonializado como planta."
       definition: "Small to medium-sized woody plant, with several stems from the base. Height between 1 and 5 m, dense canopy, ideal for hedges and borders. They photosynthesize. For the Brazilian Forest Service, it is a habit of the patrimonialized individual as a plant."
       classe.ifc: "[ IfcGeographicElement : IfcSlab : IfcPavement : IfcKerb : IfcBuildingElementProxy ]"
       categoria.revit: "[ OST_Planting : OST_PlantingHiddenLines : OST_Floors ]"
       código.abnt: "[ 3E.02.12 ]"

     - Class:
       id: Subarbusto
       subclasse.de: Flora
       subclasse.de: Reino.Vegetal
       subclasse.de: Reinos.Naturais
       subclasse.de: Conceitos
       definição: "Planta que combina características de arbustos e herbáceas. Geralmente com altura inferior a 1 metro. Possui base lenhosa (como um arbusto), mas seus ramos superiores são mais frágeis e podem ser herbáceos. Muitas espécies são perenes, mas os ramos mais altos podem morrer e se renovar periodicamente. Alguns exemplos de subarbustos são a Lavanda e o tomilho. "
       definición: "Planta que combina características de arbustos y plantas herbáceas. Normalmente con una altura inferior a 1 metro. Tiene una base leñosa (como un arbusto), pero sus ramas superiores son más frágiles y pueden ser herbáceas. Muchas especies son perennes, pero las ramas más altas pueden morir y renovarse periódicamente. Ejemplos: lavanda, tomillo y romero."
       definition: "Plant that combines characteristics of shrubs and herbaceous plants. Usually with a height of less than 1 meter. It has a woody base (like a shrub), but its upper branches are more fragile and can be herbaceous. Many species are perennials, but the taller branches can die and periodically renew themselves. Some examples of subshrubs are Lavender and Thyme."
       classe.ifc: "[ IfcGeographicElement : IfcSlab : IfcPavement : IfcKerb : IfcBuildingElementProxy ]"
       categoria.revit: "[ OST_Planting : OST_PlantingHiddenLines : OST_Floors ]"
       código.abnt: "[ 3E.02.12 ]"

     - Class:
       id: Arbóreo
       subclasse.de: Flora
       subclasse.de: Reino.Vegetal
       subclasse.de: Reinos.Naturais
       subclasse.de: Conceitos
       definição: "Planta cujo crescimento pode ser conduzido para se transformar em árvore, arbusto ou trepadeira. Fazem fotossíntese."
       definición: "Una planta cuyo crecimiento puede convertirse en un árbol, arbusto o enredadera. Realizan la fotosíntesis."
       definition: "A plant whose growth can be led to become a tree, shrub or vine. They photosynthesize."
       classe.ifc: "[ IfcGeographicElement : IfcSlab : IfcPavement : IfcKerb : IfcBuildingElementProxy ]"
       categoria.revit: "[ OST_Planting : OST_PlantingHiddenLines : OST_Floors ]"
       código.abnt: "[ 3E.02.12 ]"

     - Class:
       id: Trepadeira
       subclasse.de: Flora
       subclasse.de: Reino.Vegetal
       subclasse.de: Reinos.Naturais
       subclasse.de: Conceitos
       definição: "Planta que cresce apoiando-se em estruturas ou outras plantas. Usam gavinhas, raízes ou espinhos para se fixar. Com caules flexíveis são plantadas para cobrir pérgolas, muros e cercas. Fazem fotossíntese."
       definición: "Una planta que crece apoyándose en estructuras u otras plantas. Usan zarcillos, raíces o espinas para adherirse. Con tallos flexibles se plantan para cubrir pérgolas, paredes y cercas. Realizan la fotosíntesis."
       definition: "A plant that grows by leaning on structures or other plants. They use tendrils, roots or thorns to attach themselves. With flexible stems they are planted to cover pergolas, walls and fences. They photosynthesize."
       classe.ifc: "[ IfcGeographicElement : IfcSlab : IfcPavement : IfcKerb : IfcBuildingElementProxy ]"
       categoria.revit: "[ OST_Planting : OST_PlantingHiddenLines : OST_Floors ]"
       código.abnt: "[ 3E.02.12 ]"

     - Class:
       id: Palmeira
       subclasse.de: Flora
       subclasse.de: Reino.Vegetal
       subclasse.de: Reinos.Naturais
       subclasse.de: Conceitos
       definição: "Planta com estirpe (estrutura de sustentação) de grande variedade morfológica. Fazem fotossíntese. Para o Serviço Florestal Brasileiro é um Hábito do indivíduo definido no Inventário Florestal Nacional."
       definición: "Planta con cepa (estructura de soporte) de gran variedad morfológica. Realizan la fotosíntesis. Para el Servicio Forestal Brasileño, es un hábito del individuo definido en el Inventario Forestal Nacional."
       definition: "Plant with strain (support structure) of great morphological variety. They photosynthesize. For the Brazilian Forest Service, it is a habit of the individual defined in the National Forest Inventory."
       classe.ifc: "[ IfcGeographicElement : IfcSlab : IfcPavement : IfcKerb : IfcBuildingElementProxy ]"
       categoria.revit: "[ OST_Planting : OST_PlantingHiddenLines : OST_Floors ]"
       código.abnt: "[ 3E.02.12 ]"

     - Class:
       id: Herbácea
       subclasse.de: Flora
       subclasse.de: Reino.Vegetal
       subclasse.de: Reinos.Naturais
       subclasse.de: Conceitos
       definição: "Planta de caule macio, não lenhoso, geralmente de ciclo curto, com altura baixa, são produtoras de alimentos, ornamental ou medicinal."
       definición: "Planta de tallo blando, no leñosa, generalmente de ciclo corto, con poca altura, son productoras de alimentos, ornamentales o medicinales."
       definition: "Plant with a soft stem, non-woody, usually short-cycle, with low height, they are food producers, ornamental or medicinal."
