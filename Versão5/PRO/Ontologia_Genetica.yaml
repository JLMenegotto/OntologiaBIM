       definición: "Translación Polar. La transformación que modifica la posición de un punto mediante un desplazamiento lineal. Necesita punto base y punto objetivo."
       definition: "Polar translation. The transformation that modifies the position of a point by means of a linear displacement. You need base point and target point."

