       subclasse.de: Marcos
       subclasse.de: Demarcadas
       subclasse.de: Fronteiras
       subclasse.de: Conceitos
       definição: "Representa onde um limite administrativo (cidade ou estado) ou de manutenção (empresas ou regionais diferentes) cruza o elemento linear (trilhos ou estradas) que está sendo medido. "
       definición: "Representa el punto en el que un límite administrativo (ciudad o estado) o de mantenimiento (diferentes empresas o regiones) interseca el elemento lineal (vías férreas o carreteras) que se está midiendo."
       definition: "Represents where an administrative (city or state) or maintenance boundary (different companies or regionals) intersects the linear element (rails or roads) being measured."

