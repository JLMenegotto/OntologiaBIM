     - Class:
       id: Região.Intermediária
       subclasse.de: Políticas
       subclasse.de: Geográficas
       subclasse.de: Fronteiras
       subclasse.de: Conceitos
       definição: "Região Geográfica Intermediária. Definidas pelo IBGE do Brasil há 133 Regiões Geográficas Intermediárias, de escala maior, são articuladas por capitais regionais ou grandes centros urbanos. Pensadas para organizar o território articulando as Regiões Geográficas Imediatas por meio de um polo de hierarquia superior diferenciado a partir dos fluxos de gestão privado e público e da existência de funções urbanas de maior complexidade."
       definición: "Región Geográfica Intermedia. Definida por IBGE de Brasil, hay 133 Regiones Geográficas Intermedias, de mayor escala, articuladas por capitales regionales o grandes centros urbanos. Diseñadas para organizar el territorio articulando las Regiones Geográficas Inmediatas a través de un polo jerarquíco superior diferenciado basado en flujos de gestión privada y pública y en la existencia de funciones urbanas más complejas."
       definition: "Intermediate Geographic Region. Defined by the IBGE of Brazil, there are 133 Intermediate Geographic Regions, of a larger scale, which are articulated by regional capitals or large urban centers. Designed to organize the territory by articulating the Immediate Geographic Regions through a higher hierarchical pole differentiated from the flows of private and public management and the existence of urban functions of greater complexity."

     - Class:
       id: Região.Imediata
       subclasse.de: Políticas
       subclasse.de: Geográficas
       subclasse.de: Fronteiras
       subclasse.de: Conceitos
       definição: "Região Geográfica Imediata. Definidas pelo IBGE do Brasil há 510 Regiões Geográficas de escala menor, são articuladas por cidades médias e pequenas. É nesses centros que a população busca o que precisa no dia a dia: comprar produtos, procurar emprego, acessar serviços de saúde e educação e resolver questões em órgãos públicos, como INSS, Ministério do Trabalho e Justiça."
       definición: "Región geográfica inmediata. Definida por IBGE do Brasil, hay 510 regiones geográficas de menor escala, organizadas por ciudades medianas y pequeñas. Es en estos centros donde la población busca lo que necesita en su vida diaria: comprar productos, buscar empleo, acceder a servicios de salud y educación, y resolver problemas con organismos públicos como el INSS, el Ministerio de Trabajo y Justicia."
       definition: "Immediate geographic region. Defined by the IBGE of Brazil, there are 510 Geographic Regions of smaller scale, they are articulated by medium and small cities. It is in these centers that the population seeks what they need on a daily basis: buying products, looking for a job, accessing health and education services and solving issues in public agencies, such as the INSS, the Ministry of Labor and Justice."

