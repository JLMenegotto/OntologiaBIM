     - Class:
       id: Granito
       subclasse.de: Pedras
       subclasse.de: Matérias.Minerais.Pétreas
       subclasse.de: De.Materialidade
       subclasse.de: Conceitos
       definição: "Originada em rocha magmática intrusiva formada pelo resfriamento lento do magma. Composta por Quartzo, mica e feldspato. Muito dura, resistente, cores variadas (cinza, rosa, preto)Usada em bancadas, pisos, revestimentos, fachadas e monumentos."
       definición: "Se originó en roca magmática intrusiva formada por el lento enfriamiento del magma. Compuesto por cuarzo, mica y feldespato. Muy duro, resistente, de colores variados (gris, rosa, negro). Se usa en encimeras, suelos, recubrimientos, fachadas y monumentos."
       definition: "It originated in intrusive magmatic rock formed by the slow cooling of magma. Composed of Quartz, mica and feldspar. Very hard, resistant, varied colors (gray, pink, black)Used in countertops, floors, coatings, facades and monuments."
       classe.ifc: "[ IfcMaterial : IfcText : IfcLabel : IfcMaterialRelationship ]"
       categoria.revit: "[ OST_Materials : OST_MaterialTags ]"
       código.abnt: "[ 0M.20.10.01.01 ]"

     - Class:
       id: Mármore
       subclasse.de: Pedras
       subclasse.de: Matérias.Minerais.Pétreas
       subclasse.de: De.Materialidade
       subclasse.de: Conceitos
       definição: "Originada em calcários submetidos a altas pressões e temperaturas. Composto principalmente por calcita. Textura cristalina, veios decorativos, mais poroso que o granito. Usada em bancadas, pisos, revestimentos."
       definición: "Se originó en calizas sometidas a altas presiones y temperaturas. Compuesto principalmente de calcita. Textura cristalina, vetas decorativas, más porosas que el granito. Se usa en encimeras, suelos, recubrimientos."
       definition: "Originated in limestones subjected to high pressures and temperatures. Composed mainly of calcite. Crystalline texture, decorative veins, more porous than granite. Used in countertops, floors, coatings."
       classe.ifc: "[ IfcMaterial : IfcText : IfcLabel : IfcMaterialRelationship ]"
       categoria.revit: "[ OST_Materials : OST_MaterialTags ]"
       código.abnt: "[ 0M.20.10.01.03 ]"

