             descrição: "Árvore conhecida como Jacarandá paulista ou caroba, tem madeira escura e folhas compostas. Utilizada para reflorestamento e arborização urbana. De crescimento rápido, natural de Minas Gerais até Rio Grande do Sul. Pouco agressiva, de porte médio e extremamente ornamental pela sua floração rósea. Indicada para calçadas sem fiação elétrica. Planta decídua, heliófita, pioneira (capaz de recuperação ecológica de áreas degradadas). É característica de encostas rochosas da floresta latifoliada e transição para o cerrado (https://www.ibflorestas.org.br)"
