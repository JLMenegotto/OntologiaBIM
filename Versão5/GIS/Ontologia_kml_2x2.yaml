       subclasse.de: Interoperabilidade
       subclasse.de: Conceitos
       definição: "Elemento de sobreposição em KML. Exibe uma imagem fixa na tela do aplicativo (como logotipos, legendas ou bússolas) independente da navegação do mapa."
       definición: "Elemento superpuesto en KML. Muestra una imagen fija en la pantalla de la aplicación (como logotipos, leyendas o brújulas) independientemente de la navegación por mapa."
       definition: "Overlay element in KML. Displays a still image on the application screen (such as logos, captions, or compasses) regardless of map navigation."

