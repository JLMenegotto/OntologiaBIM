       subclasse.de: Conceitos
       definição: "Planta geralmente herbácea, com folhas estreitas, caules ocos e flores agrupadas em espiguetas."
       definición: "Plantas generalmente herbáceas, con hojas estrechas, tallos huecos y flores agrupadas en espiguillas."
       definition: "Usually herbaceous plant, with narrow leaves, hollow stems and flowers grouped in spikelets."
