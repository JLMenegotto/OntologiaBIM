             usada.para: "Ornamental em parques urbanos"
             descrição: "Tronco esguio com folhas palmadas em leque, com até 5 m de envergadura. Também é chamada de palmeira-parasol ou palma de Ceilão. Após floração deve ser monitorada por especialistas, pois pode apresentar risco de queda"
