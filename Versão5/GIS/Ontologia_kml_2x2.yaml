       definición: "Elemento superpuesto en KML. Asocia una fotografía con una ubicación geográfica específica, permitiendo navegación a gigapíxeles o vista panorámica."
       definition: "Overlay element in KML. Associates a photograph with a specific geographic location, allowing gigapixel navigation or panoramic view."

