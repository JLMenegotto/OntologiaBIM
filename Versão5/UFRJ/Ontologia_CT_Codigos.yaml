       definición: "Interruptor de relé. Controlar los circuitos eléctricos indirectamente, permitiendo que una pequeña corriente eléctrica active o apague una corriente mayor. Actúa como un interruptor electromecánico o electrónico, ampliamente utilizado en la automatización doméstica e industrial."
       definition: "Relay switch. Controlling electrical circuits indirectly, allowing a small electric current to trigger or turn off a larger current. It acts as an electromechanical or electronic switch, widely used in home and industrial automation."
