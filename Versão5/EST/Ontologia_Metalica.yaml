       subclasse.de: Paineis.Sanduíches
       subclasse.de: Sistemas.Sanduíches
       subclasse.de: Estrutura.Fechamento
       subclasse.de: Conceitos
       definição: "Painel Sandwich para fachadas de núcleos em PIR AP revestidos por chapas de aço pré-pintad. Proporcionam acabamento arquitetônico com sistema de encaixe oculto. Fabricados com injeção de espuma em alta pressão garantem uniformidade de isolamento."
       definición: "Panel sándwich para fachadas con núcleos PIR AP recubiertos de chapas de acero prepintadas. Proporcionan un acabado arquitectónico con un sistema de herrajes oculto. Fabricados con inyección de espuma a alta presión, garantizan la uniformidad del aislamiento."
       definition: "Sandwich panel for facades with PIR AP cores covered by pre-painted steel sheets. They provide architectural finish with a concealed fitting system. Manufactured with high-pressure foam injection, they ensure uniformity of insulation."
       classe.ifc: "[ IfcWall ]"
       categoria.revit: "[ OST_Walls : OST_CurtainWallPanels ]"
       código.abnt: "null"

     - Class:
       id: Painel.Sanduíche.Térmico
       subclasse.de: Paineis.Sanduíches
       subclasse.de: Sistemas.Sanduíches
       subclasse.de: Estrutura.Fechamento
       subclasse.de: Conceitos
       definição: "Painel Térmico com núcleo EPS atende demandas de isolamento térmico em ambientes que exigem controle de temperatura rigoroso, como frigoríficos e câmaras frias."
       definición: "El panel térmico con núcleo de EPS cumple con las demandas de aislamiento térmico en entornos que requieren un estricto control de temperatura, como refrigeradores y cámaras frigoríficas."
       definition: "Thermal Panel with EPS core meets thermal insulation demands in environments that require strict temperature control, such as refrigerators and cold rooms."
       classe.ifc: "[ IfcWall ]"
       categoria.revit: "[ OST_Walls : OST_CurtainWallPanels ]"
       código.abnt: "null"

