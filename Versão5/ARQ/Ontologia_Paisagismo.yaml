     - Class:
       id: Rasteira
       subclasse.de: Flora
       subclasse.de: Reino.Vegetal
       subclasse.de: Reinos.Naturais
       subclasse.de: Conceitos
       definição: "Termo genérico para plantas cultivadas. Pode incluir herbáceas, arbustos ou trepadeiras, tem uso ornamental. Fazem fotossíntese."
       definición: "Término genérico para plantas cultivadas. Puede incluir plantas herbáceas, arbustos o enredaderas, tiene uso ornamental. Realizan la fotosíntesis."
       definition: "Generic term for cultivated plants. It can include herbaceous plants, shrubs or vines, it has ornamental use. They photosynthesize."
       classe.ifc: "[ IfcGeographicElement : IfcSlab : IfcPavement : IfcKerb : IfcBuildingElementProxy ]"
