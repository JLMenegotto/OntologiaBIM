             descrição: "Arbusto ou árvore pequena, geralmente entre 3 e 7 metros de altura. Pode atingir até 10 metros em condições ideais. Folhas: Longas, estreitas e lanceoladas, com margens finamente serrilhadas. Superfície superior verde-escura e inferior esbranquiçada. Ramos muito finos, flexíveis e longos, ideais para trançados e cestaria. Flores pequenas, dispostas em amentilhos (inflorescências alongadas), com floração no início da primavera. Planta dióica (flores masculinas e femininas em indivíduos diferentes). Sistema radicular denso e superficial, com boa capacidade de fixação em solos úmidos. Em Argentina é da famílina de árvores conhecidas como 'sauces'"
