       definición: "Elemento de característica geográfica en KML. Permite insertar modelos 3D complejos (normalmente en formato COLLADA .dae) en el mapa."
       definition: "Geographic feature element in KML. Allows you to insert complex 3D models (usually in COLLADA .dae format) onto the map."

