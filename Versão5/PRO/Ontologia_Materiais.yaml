       definição: "Material construtivo usado para canalizações e redes de água quente ou gás. o cobre também é material de tubulações refrigerantes (linhas de líquido e sucção). Possui excelente condutividade térmica, alta resistência à corrosão interna e boa maleabilidade para dobras e soldagem a prata/foscoper."
       definición: "Material de construcción utilizado para fontanería y redes de agua caliente o gas. El cobre también es un material para tuberías refrigerantes (líquidos y tuberías de succión). Tiene una excelente conductividad térmica, alta resistencia a la corrosión interna y buena maleabilidad para doblar y soldar con plata/fósforo."
       definition: "Construction material used for plumbing and hot water or gas networks. Copper is also a material for refrigerant pipes (liquid and suction lines). It has excellent thermal conductivity, high resistance to internal corrosion and good malleability for bending and silver/phosphor welding."
