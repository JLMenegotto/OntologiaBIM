       definição: "Elemento de coordenadas em KML. Coordenadas. X, Y, Z separadas por vírgula e coordenadas por espaços <coordinates>x1 , y1 , z1   x2 , y2 , z2   x3 , y3 , z3   x4 , y4 , z4</coordinates>."
       definición: "Elemento de coordenadas en KML. Coordenadas. X, Y, Z separados por comas y coordenadas por espacios <coordinates>x1, y1, z1 x2, y2, z2 x3, y3, z3 x4, y4, z4</coordinates>."
       definition: "Coordinate element in KML. Coordinates. X, Y, Z separated by commas and coordinates by spaces <coordinates>x1, y1, z1 x2, y2, z2 x3, y3, z3 x4, y4, z4</coordinates>."

     - Class:
       id: Kml.Lugar.Segmento
       subclasse.de: KML
       subclasse.de: Esquemas
       subclasse.de: Interoperabilidade
       subclasse.de: Conceitos
       definição: "Elemento de feição geográfica em KML. Define uma linha continuada por meio de uma sequência de coordenadas (útil para caminhos, rotas e rios)."
       definición: "Elemento de característica geográfica en KML. Define una línea continua a través de una secuencia de coordenadas (útil para caminos, rutas y ríos)."
       definition: "Geographic feature element in KML. Defines a continuous line through a coordinate sequence (useful for paths, routes, and rivers)."

     - Class:
       id: Kml.Lugar.Segmento.Poligonal
       subclasse.de: KML
       subclasse.de: Esquemas
       subclasse.de: Interoperabilidade
       subclasse.de: Conceitos
       definição: "Elemento de feição geográfica em KML. Uma linha fechada e não auto-intersectante, usada principalmente para definir os limites de um polígono."
       definición: "Elemento de característica geográfica en KML. Una línea cerrada y no autointersectante, utilizada principalmente para definir los límites de un polígono."
       definition: "Geographic feature element in KML. A closed and non-self-intersecting line, mainly used to define the boundaries of a polygon."

     - Class:
       id: Kml.Lugar.Segmento.Poligono
       subclasse.de: KML
       subclasse.de: Esquemas
       subclasse.de: Interoperabilidade
       subclasse.de: Conceitos
       definição: "Elemento de feição geográfica em KML. Define uma área delimitada por um limite externo (<outerBoundaryIs>) e, opcionalmente, limites internos (<innerBoundaryIs>) para criar buracos."
       definición: "Elemento de característica geográfica en KML. Define un área delimitada por un límite exterior (<outerBoundaryIs>) y, opcionalmente, por límites interiores (<innerBoundaryIs>) para crear agujeros."
       definition: "Geographic feature element in KML. Defines an area bounded by an outer boundary (<outerBoundaryIs>) and, optionally, inner boundaries (<innerBoundaryIs>) to create holes."

     - Class:
       id: Kml.Lugar.Segmento.Projeção
       subclasse.de: KML
       subclasse.de: Esquemas
       subclasse.de: Interoperabilidade
       subclasse.de: Conceitos
       definição: "Controla se uma linha ou polígono acompanha a curvatura da terra, os relevos do terreno ou se é desenhada como uma linha reta direta no espaço tridimensional. <tessellate>1</tessellate> Funciona somente se o modo de altitude (<altitudeMode>) está definido como clampToGround (preso ao solo, que é o padrão). Se a altitude for absoluta ou relativa ao solo, o efeito do tessellate é ignorado."
       definición: "Controla si una línea o polígono sigue la curvatura de la tierra, los relieves del terreno o se dibuja como una línea recta en el espacio tridimensional. <tessellate>1</tessellate> Funciona solo si el modo altitud (<altitudeMode>) está configurado en clampToGround (que es el valor predeterminado). Si la altitud es absoluta o relativa al suelo, se ignora el efecto teselado."
       definition: "Controls whether a line or polygon follows the curvature of the earth, terrain reliefs, or is drawn as a straight line in three-dimensional space. <tessellate>1</tessellate> Works only if the altitude mode (<altitudeMode>) is set to clampToGround (which is the default). If altitude is absolute or relative to the ground, the tessellate effect is ignored."

