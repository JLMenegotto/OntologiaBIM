     - Class:
       id: Croma
       subclasse.de: Munsell
       subclasse.de: Paletas
       subclasse.de: Cromáticos
       subclasse.de: Conceitos
       definição: "Sistema de cor Munsell: Parâmetro Croma. É o grau de afastamento de uma cor em relação à cor neutra de mesmo valor. Um baixo croma enfraquece a cor. Um croma alto para cor saturada, forte ou vívida."
       definición: "Sistema de color Munsell: Parámetro Croma. Es el grado de distancia de un color al color neutro del mismo valor. Un cromo bajo debilita el color. Un alto nivel de cromancia para colores saturados, intensos o vivos."
       definition: "Munsell Color System: Croma Parameter. It is the degree of distance of a color from the neutral color of the same value. A low chroma weakens the color. A high chroma for saturated, strong, or vivid color."

