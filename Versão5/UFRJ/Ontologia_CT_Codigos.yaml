     - Class:
       id: Esquema.TN
       subclasse.de: Conexões.de.EE
       subclasse.de: Redes.Elétricas
       subclasse.de: Redes.Urbanas
       subclasse.de: Conceitos
       definição: "Consultar Norma NBR 5410. Ponto da alimentação diretamente aterrado, sendo as massas ligadas a esse ponto através de condutores de proteção. São consideradas três variantes de esquema TN, de acordo com a disposição do condutor neutro e do condutor de proteção: esquema TN-S, o condutor neutro e o condutor de proteção são distintos; esquema TN-C-S, as funções de neutro e de proteção são combinadas em um único condutor; esquema TN-C, as funções de neutro e de proteção são combinadas em um único condutor, na totalidade do esquema."
       definición: "Consulte la norma NBR 5410. El punto de suministro está directamente conectado a tierra, con las masas conectadas a este punto por conductores de protección. Se consideran tres variantes del esquema TN, de acuerdo con la disposición del conductor neutro y el conductor de protección: esquema TN-S, el conductor neutro y el conductor de protección son distintos; Las funciones de esquema, neutro y protección de TN-C-S se combinan en un solo conductor; En el esquema TN-C, las funciones de neutro y protección se combinan en un solo conductor en todo el esquema."
       definition: "Consult NBR 5410 Standard. The point of the supply is directly grounded, with the masses connected to this point by protective conductors. Three variants of TN scheme are considered, according to the arrangement of the neutral conductor and the protective conductor: TN-S scheme, the neutral conductor and the protective conductor are distinct; TN-C-S scheme, neutral and protection functions are combined in a single conductor; In the TN-C scheme, the neutral and protection functions are combined in a single conductor in the entire scheme."
       classe.ifc: "[ IfcDistributionSystemCATENARY_SYSTEM ]"
       categoria.revit: "[ OST_ElecDistributionSys ]"
       código.abnt: "null"

     - Class:
       id: Esquema.TT
       subclasse.de: Conexões.de.EE
       subclasse.de: Redes.Elétricas
       subclasse.de: Redes.Urbanas
       subclasse.de: Conceitos
       definição: "Consultar Norma NBR 5410. Ponto de alimentação diretamente aterrado, estando as massas da instalação ligadas a eletrodo(s) de aterramento eletricamente distinto(s) do eletrodo de aterramento da alimentação"
       definición: "Consulte la norma NBR 5410. Punto de suministro conectado a tierra directamente, con las tierras de instalación conectadas a los electrodos de puesta a tierra eléctricamente distintos del electrodo de puesta a tierra del suministro"
       definition: "Consult NBR 5410 Standard. Directly grounded supply point, with the installation grounds connected to grounding electrode(s) electrically distinct from the grounding electrode of the supply"
       classe.ifc: "[ IfcDistributionSystemCATENARY_SYSTEM ]"
       categoria.revit: "[ OST_ElecDistributionSys ]"
       código.abnt: "null"

     - Class:
