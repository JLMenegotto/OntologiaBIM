     - Class:
       id: Bambu
       subclasse.de: Flora
       subclasse.de: Reino.Vegetal
       subclasse.de: Reinos.Naturais
       subclasse.de: Conceitos
       definição: "Planta tipo gramínea lenhosa. Com caule cilíndrico e oco chamado de colmo segmentado por nós. Pode atingir até 30 metros de altura. Folhas alongadas, verdes e resistentes. Rizomatoso, permitindo propagação subterrânea. Usado em cnstrução civil, artesanato, alimentação (brotos), papel, fibras têxteis e ornamentação. Para o Serviço Florestal Brasileiro é um Hábito do indivíduo definido no Inventário Florestal Nacional."
       definición: "Planta leñosa tipo hierba. con un tallo cilíndrico y hueco llamado tallo segmentado por nosotros. Puede alcanzar hasta 30 metros de altura. Hojas alargadas, verdes y resistentes. Rizomatoso, lo que permite la propagación subterránea. Utilizado en construcción civil, artesanía, alimentos (brotes), papel, fibras textiles y ornamentación. Para el Servicio Forestal Brasileño, es un hábito del individuo definido en el Inventario Forestal Nacional."
       definition: "Woody grass-type plant. with a cylindrical, hollow stem called a segmented stem by us. It can reach up to 30 meters in height. Elongated, green and resistant leaves. Rhizomatous, allowing underground propagation. Used in civil construction, crafts, food (sprouts), paper, textile fibers and ornamentation. For the Brazilian Forest Service, it is a habit of the individual defined in the National Forest Inventory."
       classe.ifc: "[ IfcGeographicElement : IfcSlab : IfcPavement : IfcKerb : IfcBuildingElementProxy ]"
       categoria.revit: "[ OST_Planting : OST_PlantingHiddenLines : OST_Floors ]"
       código.abnt: "[ 3E.02.12 ]"

     - Class:
       id: Liana
       subclasse.de: Flora
       subclasse.de: Reino.Vegetal
       subclasse.de: Reinos.Naturais
       subclasse.de: Conceitos
       definição: "Planta tipo trepadeira lenhosa. Germina no solo e cresce apoiando-se em outras plantas para alcançar luz no dossel das florestas. Caule flexível capaz de se deformar sem quebrar. Usa gavinhas, raízes grampiformes ou terminações adesivas para escalar. Conecta copas de árvores, serve de caminho para animais, aumenta a diversidade florística. Usadas para fazer cordas, artesanato, medicina tradicional anti-inflamatório, antirreumático. Para o Serviço Florestal Brasileiro é um Hábito do indivíduo definido no Inventário Florestal Nacional."
       definición: "Planta trepadora leñosa. Germina en el suelo y crece apoyándose en otras plantas para alcanzar la luz en el dosel del bosque. Vástago flexible capaz de deformarse sin romperse. Use zarcillos, raíces grapadas o terminaciones adhesivas para trepar. Conecta las copas de los árboles, sirve como camino para los animales, aumenta la diversidad florística. Se utiliza para hacer cuerdas, artesanías, medicina tradicional antiinflamatoria, antirreumática. Para el Servicio Forestal Brasileño, es un hábito del individuo definido en el Inventario Forestal Nacional."
       definition: "Woody climbing plant. It germinates in the soil and grows by leaning on other plants to reach light in the forest canopy. Flexible stem capable of deforming without breaking. Use tendrils, staple roots, or adhesive endings to climb. It connects tree canopies, serves as a path for animals, increases floristic diversity. Used to make ropes, handicrafts, traditional anti-inflammatory, antirheumatic medicine. For the Brazilian Forest Service, it is a habit of the individual defined in the National Forest Inventory."
       classe.ifc: "[ IfcGeographicElement : IfcSlab : IfcPavement : IfcKerb : IfcBuildingElementProxy ]"
       categoria.revit: "[ OST_Planting : OST_PlantingHiddenLines : OST_Floors ]"
       código.abnt: "[ 3E.02.12 ]"

     - Class:
       id: Cacto
       subclasse.de: Flora
       subclasse.de: Reino.Vegetal
       subclasse.de: Reinos.Naturais
       subclasse.de: Conceitos
       definição: "Planta arbustiva ou subarbustiva. Com caule carnoso, fotossintético que armazena água. Pode ter forma globosa, colunar ou em raquete. Folhas modificadas em espinhos, que protegem e reduzem evaporação. Raiz superficial e extensa, absorve rapidamente água após chuvas. Tem aréolas que são estruturas exclusivas dos cactos, de onde surgem espinhos, flores e brotos. Flores grandes, vistosas, hermafroditas, com cores variadas. Metabolismo CAM (fazem fotossíntese noturna), espinhos, armazenamento de água. Muito usados para ornamentação, alimentação (figo da índia), forragem, medicina popular. Para o Serviço Florestal Brasileiro é um Hábito do indivíduo definido no Inventário Florestal Nacional."
       definición: "Planta arbustiva o subarbustiva. Con un tallo carnoso y fotosintético que almacena agua. Puede ser globosa, columnar o en forma de raqueta. Hojas modificadas en espinas, que protegen y reducen la evaporación. Raíz poco profunda y extensa, absorbe agua rápidamente después de las lluvias. Tiene areolas que son estructuras exclusivas de los cactus, de las que emergen espinas, flores y brotes. Flores grandes, vistosas, hermafroditas, con colores variados. Metabolismo CAM (fotosíntesis nocturna), espinas, almacenamiento de agua. Ampliamente utilizado para ornamentación, alimentación (por ejemplo, tuna), forraje, medicina popular. Para el Servicio Forestal Brasileño, es un hábito del individuo definido en el Inventario Forestal Nacional."
       definition: "Shrubby or subshrub plant. With a fleshy, photosynthetic stem that stores water. It can be globose, columnar or racket shaped. Leaves modified into thorns, which protect and reduce evaporation. Shallow and extensive root, absorbs water quickly after rains. It has areoles that are structures exclusive to cacti, from which thorns, flowers and shoots emerge. Large, showy, hermaphroditic flowers, with varied colors. CAM metabolism (do nocturnal photosynthesis), spines, water storage. Widely used for ornamentation, food (prickly pear), fodder, folk medicine. For the Brazilian Forest Service, it is a habit of the individual defined in the National Forest Inventory."
       classe.ifc: "[ IfcGeographicElement : IfcSlab : IfcPavement : IfcKerb : IfcBuildingElementProxy ]"
       categoria.revit: "[ OST_Planting : OST_PlantingHiddenLines : OST_Floors ]"
       código.abnt: "[ 3E.02.12 ]"

