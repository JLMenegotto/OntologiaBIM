       subclasse.de: Redes.Elétricas
       subclasse.de: Redes.Urbanas
       subclasse.de: Conceitos
       definição: "Consultar Norma NBR 5410. Todas as partes vivas são isoladas da terra ou um ponto da alimentação é aterrado através de impedância. As massas da instalação são aterradas. "
       definición: "Consulte la norma NBR 5410. Todas las partes vivas están aisladas de la tierra o un punto de alimentación está conectado a tierra mediante impedancia. Las masas de la instalación están conectadas a tierra."
       definition: "Consult NBR 5410 Standard. All living parts are isolated from the earth or a feed point is grounded via impedance. The masses of the installation are grounded."
