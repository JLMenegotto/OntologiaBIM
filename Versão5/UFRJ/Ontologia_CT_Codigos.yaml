       definición: "Región geográfica inmediata. Definida por IBGE do Brasil, hay 510 regiones geográficas de menor escala, organizadas por ciudades medianas y pequeñas. Es en estos centros donde la población busca lo que necesita en su vida diaria: comprar productos, buscar empleo, acceder a servicios de salud y educación, y resolver problemas con organismos públicos como el INSS, el Ministerio de Trabajo y Justicia."
